baseURL = "https://johnson-cooper.github.io/"
languageCode = "en-US"
title = "Cooper Johnson"
copyright = "Cooper Johnson"

# Single-language site served from the root. Old /en/... URLs are kept alive
# through `aliases` in each page's front matter.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
enableEmoji = false
pygmentsUseClasses = true

[outputs]
  home = ["html", "rss"]
  section = ["html"]

[sitemap]
  changefreq = "monthly"
  priority = 0.5

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = true
  style = "github-dark"

[params]
  description = "Cooper Johnson is a software engineer who builds full-stack applications and native software for resource-constrained hardware, including original PlayStation 2 tooling in C and C++."
  role = "Software Engineer"
  github = "https://github.com/johnson-cooper"
  email = "cooperjohnson0000@gmail.com"
  music = "https://attackishere.com"
  ogImage = "og.png"

[menus]
  [[menus.main]]
    name = "Work"
    pageRef = "/work"
    weight = 10
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 20
  [[menus.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 30
